name: custom_lint_builder
version: 0.7.0+temp
description: A package to help writing custom linters
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  analyzer: ^6.11.0
  analyzer_plugin: ^0.11.0
  collection: ^1.16.0
  # Using tight constraints as custom_lint_builder communicate with each-other
  # using a specific contract
  custom_lint:
    path: ../custom_lint
  # Using tight constraints as custom_lint_builder communicate with each-other
  # using a specific contract
  custom_lint_core:
    path: ../custom_lint_core
  # Using loose constraint to support a range of analyzer versions.
  custom_lint_visitor:
    path: ../custom_lint_visitor
  glob: ^2.1.1
  hotreloader: ">=3.0.5 <5.0.0"
  meta: ^1.7.0
  package_config: ^2.1.0
  path: ^1.8.0
  pubspec_parse: ^1.2.0
  rxdart: ^0.28.0

dev_dependencies:
  test: ^1.22.2
